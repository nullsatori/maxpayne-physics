[package]
name = "mp1phys"
description = "Injected into Max Payne 1: sends game events, applies streamed poses"
version.workspace = true
edition.workspace = true
publish.workspace = true

[lib]
crate-type = ["cdylib"]

[dependencies]
bridge.workspace = true

# The games are 32-bit; the plugins only exist for x86 Windows.
[target.'cfg(all(windows, target_arch = "x86"))'.dependencies]
peimage.workspace = true
winmod.workspace = true
