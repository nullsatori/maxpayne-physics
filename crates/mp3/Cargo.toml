[package]
name = "mp3bridge"
description = "Injected into Max Payne 3: drives puppets, streams their poses"
version.workspace = true
edition.workspace = true
publish.workspace = true

[lib]
crate-type = ["cdylib"]

[dependencies]
bridge.workspace = true
glamx.workspace = true
pose.workspace = true
scripthook.workspace = true

# The games are 32-bit; the plugins only exist for x86 Windows.
[target.'cfg(all(windows, target_arch = "x86"))'.dependencies]
peimage.workspace = true
winmod.workspace = true
